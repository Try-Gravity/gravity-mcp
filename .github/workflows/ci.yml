name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gravity
          POSTGRES_PASSWORD: gravity
          POSTGRES_DB: gravity
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gravity"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://gravity:gravity@localhost:5432/gravity

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run unit tests
        run: uv run pytest tests/test_tools.py -v

  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker compose build

      - name: Start containers
        run: docker compose up -d

      - name: Wait for healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health; then
              echo " healthy"
              exit 0
            fi
            sleep 2
          done
          echo "Container never became healthy"
          docker compose logs
          exit 1

      - name: Check version endpoint
        run: curl -sf http://localhost:8000/version | grep version

      - name: Teardown
        if: always()
        run: docker compose down -v
